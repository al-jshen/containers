# Proxy providers in forward-auth (single application) mode, fronted by caddy.
# Matches the hand-made "Provider for dozzle" so all of these behave the same.
# Apply: docker exec authentik-worker-1 ak apply_blueprint /blueprints/custom/forward-auth-apps.yaml
version: 1
metadata:
  name: forward-auth apps (calibre, library, bazarr, qbittorrent)

entries:
  # --- calibre desktop gui (kasmvnc) ---
  - model: authentik_providers_proxy.proxyprovider
    id: provider-calibre
    identifiers:
      name: Provider for calibre
    attrs:
      mode: forward_single
      external_host: https://calibre.jshen.net
      intercept_header_auth: true
      access_token_validity: hours=24
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: app-calibre
    identifiers:
      slug: calibre
    attrs:
      name: calibre
      provider: !KeyOf provider-calibre

  # --- calibre content server ---
  - model: authentik_providers_proxy.proxyprovider
    id: provider-library
    identifiers:
      name: Provider for library
    attrs:
      mode: forward_single
      external_host: https://library.jshen.net
      intercept_header_auth: true
      access_token_validity: hours=24
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: app-library
    identifiers:
      slug: library
    attrs:
      name: library
      provider: !KeyOf provider-library

  # --- bazarr ---
  - model: authentik_providers_proxy.proxyprovider
    id: provider-bazarr
    identifiers:
      name: Provider for bazarr
    attrs:
      mode: forward_single
      external_host: https://bazarr.jshen.net
      intercept_header_auth: true
      access_token_validity: hours=24
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: app-bazarr
    identifiers:
      slug: bazarr
    attrs:
      name: bazarr
      provider: !KeyOf provider-bazarr

  # --- qbittorrent (web ui only; the *arrs reach it internally via gluetun) ---
  - model: authentik_providers_proxy.proxyprovider
    id: provider-qbittorrent
    identifiers:
      name: Provider for qbittorrent
    attrs:
      mode: forward_single
      external_host: https://qbittorrent.jshen.net
      intercept_header_auth: true
      access_token_validity: hours=24
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: app-qbittorrent
    identifiers:
      slug: qbittorrent
    attrs:
      name: qbittorrent
      provider: !KeyOf provider-qbittorrent

  # Full provider list for the embedded outpost. This REPLACES the list, so the
  # four pre-existing providers are repeated here on purpose -- dropping one
  # would unbind that app.
  - model: authentik_outposts.outpost
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      providers:
        - !Find [authentik_core.provider, [name, Provider for sonarr]]
        - !Find [authentik_core.provider, [name, Provider for Radarr]]
        - !Find [authentik_core.provider, [name, Provider for Prowlarr]]
        - !Find [authentik_core.provider, [name, Provider for dozzle]]
        - !KeyOf provider-calibre
        - !KeyOf provider-library
        - !KeyOf provider-bazarr
        - !KeyOf provider-qbittorrent
