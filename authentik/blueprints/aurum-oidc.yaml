# OIDC for aurum (aurum.jshen.net).
# Confidential client: the secret is generated by authentik and read out into
# aurum/.env (OIDC_CLIENT_ID / OIDC_CLIENT_SECRET), so it never lands in git.
# The issuer aurum needs is https://auth.jshen.net/application/o/aurum/
# Apply: docker exec authentik-worker-1 ak apply_blueprint /blueprints/custom/aurum-oidc.yaml
version: 1
metadata:
  name: aurum oidc

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-aurum
    identifiers:
      name: Provider for aurum
    attrs:
      client_type: confidential
      sub_mode: hashed_user_id
      access_code_validity: minutes=1
      access_token_validity: hours=24
      # blueprint-created providers default grant_types to an empty list, which
      # makes authentik reject the login with "Invalid grant_type for provider".
      # aurum only ever exchanges a code; it discards the access token and asks
      # for no refresh token.
      grant_types:
        - authorization_code
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Required, not optional: without a signing key authentik signs the id_token
      # with HS256, and aurum's algorithm whitelist refuses anything but RSA/ECDSA.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: https://aurum.jshen.net/api/v1/auth/oidc/callback
          matching_mode: strict
      property_mappings:
        - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]

  - model: authentik_core.application
    identifiers:
      slug: aurum
    attrs:
      name: aurum
      provider: !KeyOf provider-aurum
      meta_launch_url: https://aurum.jshen.net/
