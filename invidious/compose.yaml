# Trimmed from the upstream docker-compose.yml (https://docs.invidious.io/installation/).
# Runs the published images; the only files needed from the repo are the db
# init scripts in ./init. Secrets come from .env -- copy .env.example.
services:
  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: invidious
    restart: unless-stopped
    # the vps reverse proxy reaches this over tailscale at substrate:10001
    ports:
      - 10001:3000
    environment:
      # options: https://github.com/iv-org/invidious/blob/master/config/config.example.yml
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${INVIDIOUS_DB_PASSWORD:?set in .env}
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
        - private_url: "http://companion:8282/companion"
        invidious_companion_key: ${INVIDIOUS_COMPANION_KEY:?set in .env}
        # served publicly by the vps caddy at https://invidious.jshen.net
        external_port: 443
        domain: invidious.jshen.net
        https_only: true
        registration_enabled: false
        hmac_key: ${INVIDIOUS_HMAC_KEY:?set in .env}
        use_innertube_for_captions: true
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options:
        max-size: "1G"
        max-file: "4"
    depends_on:
      - invidious-db
    networks:
      - default
      - caddy_net

  companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: invidious-companion
    # the vps serves /companion/* from here, since companion streams video to the client
    ports:
      - 8282:8282
    environment:
      - SERVER_SECRET_KEY=${INVIDIOUS_COMPANION_KEY:?set in .env}
    restart: unless-stopped
    logging:
      options:
        max-size: "1G"
        max-file: "4"
    cap_drop:
      - ALL
    read_only: true
    # cache for youtube library
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - caddy_net

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
      # only run when the volume is empty
      - ./init/sql:/config/sql
      - ./init/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${INVIDIOUS_DB_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

volumes:
  postgresdata:
  companioncache:

networks:
  caddy_net:
    external: true
