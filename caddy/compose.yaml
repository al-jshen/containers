services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    ports:
      # - 80:80
      - 443:443
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./config:/config
      - $PWD/Caddyfile:/etc/caddy/Caddyfile
    networks:
      # pinned so qbittorrent can whitelist this exact address and skip its own
      # login for requests that already passed authentik
      default:
        ipv4_address: 172.20.0.250

networks:
  default:
    name: caddy_net
    external: true
