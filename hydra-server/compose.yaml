services:
  hydra-server:
    container_name: hydra-server
    build:
      context: https://github.com/dmilin1/hydra-server.git
    ports:
      - 10003:3000
    volumes:
      - ./config:/app/config
      - ./data:/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - IS_CUSTOM_SERVER=true
