services:
  radarr:
    container_name: radarr
    hostname: radarr.internal
    image: ghcr.io/hotio/radarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    # ports:
    #   - 7878:7878
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/radarr:/config
      - /external/data:/data
    networks:
      - caddy
  sonarr:
    container_name: sonarr
    hostname: sonarr.internal
    image: ghcr.io/hotio/sonarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    # ports:
    #   - 8989:8989
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/sonarr:/config
      - /external/data:/data
    networks:
      - caddy
  bazarr:
    container_name: bazarr
    hostname: bazarr.internal
    image: ghcr.io/hotio/bazarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    # ports:
    #   - 6767:6767
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/bazarr:/config
      - /external/data:/data
    networks:
      - caddy
  prowlarr:
    container_name: prowlarr
    hostname: prowlarr.internal
    image: ghcr.io/hotio/prowlarr
    restart: unless-stopped
    logging:
      driver: json-file
    # ports:
    #   - 9696:9696
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker/appdata/prowlarr:/config
    networks:
      - caddy
  seerr:
    image: ghcr.io/seerr-team/seerr:preview-new-oidc
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/New_York
    #   # - PORT=5055 #optional
    # ports:
    #   - 5055:5055
    volumes:
      - /docker/appdata/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - caddy
  # jellyseerr:
  #   image: ghcr.io/fallenbagel/jellyseerr:latest
  #   init: true
  #   container_name: jellyseerr
  #   environment:
  #     - LOG_LEVEL=debug
  #     - TZ=America/New_York
  #   #   - PORT=5055 #optional
  #   # ports:
  #   #   - 5055:5055
  #   volumes:
  #     - /docker/appdata/jellyseerr:/app/config
  #   healthcheck:
  #     test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
  #     start_period: 20s
  #     timeout: 3s
  #     interval: 15s
  #     retries: 3
  #   restart: unless-stopped
  #   networks:
  #     - caddy
      #
  redis:
    image: redis:8.8.1-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s
    networks:
      - caddy

  trawl:
    container_name: trawl
    image: ghcr.io/germondai/trawl:latest
    # ports:
    #   # API + FlareSolverr-compatible /v1
    #   - "${PORT:-8191}:8191"
    #   # MITM forward proxy (:8192) — only used when MITM_PROXY_ENABLED=true.
    #   # The CA cert is served from :8191/proxy-ca.crt and must be installed
    #   # in each client's trust store (system keychain, Java cacerts, etc.).
    #   - "${MITM_PROXY_PORT:-8192}:${MITM_PROXY_PORT:-8192}"
    shm_size: 1gb
    environment:
      REDIS_URL: redis://redis:6379
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-1}
      BROWSER_HEADFUL_POOL_SIZE: ${BROWSER_HEADFUL_POOL_SIZE:-0}
      PROXY_URL: ${PROXY_URL:-}
      PROXY_LIST_FILE: ${PROXY_LIST_FILE:-}
      RESIDENTIAL_PROXY_URL: ${RESIDENTIAL_PROXY_URL:-}
      RESIDENTIAL_PROXY_LIST_FILE: ${RESIDENTIAL_PROXY_LIST_FILE:-}
      # MITM proxy (off by default — opt in via .env)
      MITM_PROXY_ENABLED: ${MITM_PROXY_ENABLED:-false}
      MITM_PROXY_HOST: ${MITM_PROXY_HOST:-0.0.0.0}
      MITM_PROXY_PORT: ${MITM_PROXY_PORT:-8192}
      MITM_PROXY_CA_DIR: ${MITM_PROXY_CA_DIR:-/data/proxy-ca}
      MITM_PROXY_MAX_TIER: ${MITM_PROXY_MAX_TIER:-4}
      MITM_PROXY_DEBUG: ${MITM_PROXY_DEBUG:-false}
    volumes:
      # Persist the proxy's CA so clients don't need to re-install on every restart.
      - trawl_proxy_ca:${MITM_PROXY_CA_DIR:-/data/proxy-ca}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - caddy

volumes:
  redis_data:
  trawl_proxy_ca:

networks:
  caddy:
    name: caddy_net
    external: true
